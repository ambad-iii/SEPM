<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TripEase - My Trips</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            ✈ <span>Trip<span class="blue-text">Ease</span></span>
        </div>

        <nav>

            <a href="index.html" class="nav-link">
                ⌂ <span>Dashboard</span>
            </a>

            <a href="explore.html" class="nav-link">
                ◉ <span>Explore</span>
            </a>

            <a href="bookings.html" class="nav-link">
                ▣ <span>Bookings</span>
            </a>

            <a href="my-trips.html" class="nav-link active">
                ▤ <span>My Trips</span>
            </a>

            <a href="budget.html" class="nav-link">
                ◇ <span>Travel Budget</span>
            </a>

            <a href="profile.html" class="nav-link">
                ♙ <span>Profile</span>
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h2>My Trips 🧳</h2>

                <p>
                    Manage your planned journeys.
                </p>

            </div>

            <div class="user-mini">

                <div class="avatar">A</div>

                <div>

                    <strong>Anil</strong>

                    <small>Traveler</small>

                </div>

            </div>

        </header>


        <section class="page-header">

            <h1>Your Trips</h1>

            <p>
                All your planned trips in one place.
            </p>

        </section>


        <div
            id="tripsContainer"
            class="trip-grid"
        ></div>

    </main>

</div>


<!-- VIEW PLAN MODAL -->

<div
    class="modal"
    id="viewPlanModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="planTitle">
                Trip Plan
            </h2>

            <button
                class="close-btn"
                onclick="closeViewPlan()"
            >
                ×
            </button>

        </div>


        <div id="tripPlanContent"></div>

    </div>

</div>


<script src="app.js"></script>


<script>

/* =========================================================
   LOAD TRIPS
========================================================= */

function displayTrips() {

    const container =
        document.getElementById(
            "tripsContainer"
        );


    const trips =
        getData(
            STORAGE_KEYS.trips,
            []
        );


    if (trips.length === 0) {

        container.innerHTML = `

            <div class="empty-card">

                <div class="empty-icon">
                    🧳
                </div>

                <h3>
                    No trips planned yet
                </h3>

                <p>
                    Explore destinations and create your first trip.
                </p>

                <a
                    href="explore.html"
                    class="primary-btn"
                >
                    Explore Destinations
                </a>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    trips.forEach(
        (trip, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "trip-card";


            card.innerHTML = `

                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        align-items:start;
                    "
                >

                    <div>

                        <h3>
                            🌍 ${trip.destination}
                        </h3>

                        <p class="trip-info">
                            📍 ${trip.location}
                        </p>

                    </div>

                    <span
                        class="recommended-label"
                    >
                        PLANNED
                    </span>

                </div>


                <hr
                    style="
                        margin:15px 0;
                        border:0;
                        border-top:1px solid #e2e8f0;
                    "
                >


                <p class="trip-info">

                    📅
                    ${formatDate(trip.startDate)}
                    -
                    ${formatDate(trip.endDate)}

                </p>


                <p class="trip-info">

                    🗓️
                    ${trip.days} Days •
                    ${trip.nights} Nights

                </p>


                <p class="trip-info">

                    👥
                    ${trip.travellers} Travellers

                </p>


                <p class="trip-info">

                    🎯
                    ${trip.style}

                </p>


                <p class="trip-info">

                    💰 Budget:
                    ${formatCurrency(trip.budget)}

                </p>


                <div class="trip-actions">

                    <button
                        class="primary-btn"
                        onclick="viewPlan(${index})"
                    >
                        View Plan
                    </button>

                    <button
                        class="secondary-btn"
                        onclick="deleteTrip(${index})"
                    >
                        Delete
                    </button>

                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* =========================================================
   VIEW PLAN
========================================================= */

function viewPlan(index) {

    const trips =
        getData(
            STORAGE_KEYS.trips,
            []
        );


    const trip =
        trips[index];


    document
        .getElementById(
            "planTitle"
        )
        .textContent =
        `${trip.destination} Trip Plan`;


    const container =
        document.getElementById(
            "tripPlanContent"
        );


    let itinerary = [];


    if (trip.destination === "Munnar") {

        itinerary = [

            "Arrival + Hotel Check-in",

            "Tea Gardens + Mattupetty Dam",

            "Eravikulam National Park",

            "Adventure Activities + Local Food",

            "Shopping + Departure"

        ];

    }

    else if (trip.destination === "Goa") {

        itinerary = [

            "Arrival + Beach Evening",

            "North Goa Sightseeing",

            "Water Sports + Beach Activities",

            "Old Goa + Local Food",

            "Shopping + Departure"

        ];

    }

    else {

        itinerary = [

            "Arrival + Hotel Check-in",

            "Local Sightseeing",

            "Popular Attractions",

            "Adventure / Leisure Activities",

            "Shopping + Departure"

        ];

    }


    let html = `

        <div class="form-card">

            <h3>
                🌍 ${trip.destination}
            </h3>

            <p class="trip-info">
                📍 ${trip.location}
            </p>

            <p class="trip-info">
                📅 ${formatDate(trip.startDate)}
                -
                ${formatDate(trip.endDate)}
            </p>

            <p class="trip-info">
                👥 ${trip.travellers} Travellers
            </p>

            <p class="trip-info">
                💰 Budget:
                ${formatCurrency(trip.budget)}
            </p>

        </div>

        <h3>
            🗓️ Day-wise Itinerary
        </h3>

        <br>

    `;


    for (
        let day = 0;
        day < trip.days;
        day++
    ) {

        const currentDate =
            new Date(trip.startDate);


        currentDate.setDate(
            currentDate.getDate() + day
        );


        const activity =
            itinerary[
                day % itinerary.length
            ];


        html += `

            <div class="recommendation">

                <div>

                    <strong>
                        Day ${day + 1}
                    </strong>

                    <p class="trip-info">

                        📅
                        ${formatDate(
                            currentDate
                        )}

                    </p>

                    <p
                        style="
                            margin-top:8px;
                        "
                    >
                        ${activity}
                    </p>

                </div>

            </div>

        `;

    }


    html += `

        <br>

        <div
            style="
                background:#eff6ff;
                padding:18px;
                border-radius:12px;
            "
        >

            <strong>
                💡 TripEase Recommendation
            </strong>

            <p
                class="trip-info"
                style="margin-top:8px"
            >
                Your ${trip.style.toLowerCase()}
                travel style has been used to prepare
                this suggested itinerary.
            </p>

        </div>

        <br>

        <a
            href="bookings.html"
            class="primary-btn"
        >
            ✈️ Book Flight / Hotel
        </a>

    `;


    container.innerHTML = html;


    document
        .getElementById(
            "viewPlanModal"
        )
        .classList
        .add("show");

}


/* =========================================================
   CLOSE PLAN
========================================================= */

function closeViewPlan() {

    document
        .getElementById(
            "viewPlanModal"
        )
        .classList
        .remove("show");

}


displayTrips();

</script>

</body>
</html>
